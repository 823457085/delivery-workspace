<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · 启元</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color: #e7ebf4; background: #101621; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 15% 0%,#29364f 0,transparent 55%),radial-gradient(ellipse at 95% 100%,#3a2841 0,transparent 50%); }
    main { width: 100%; max-width: 420px; padding: 36px; background: #1b2330; border: 1px solid #3a455b; border-radius: 18px; box-shadow: 0 20px 65px #0005; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark { display: grid; place-items: center; width: 44px; height: 44px; background: linear-gradient(135deg,#9db9ed,#eda4dc); color: #19202d; font-size: 28px; border-radius: 12px; }
    h1 { margin: 0; font-size: 24px; letter-spacing: 2px; }
    .sub { margin: 2px 0 0; color: #aab6cb; font-size: 13px; }
    h2 { font-size: 20px; margin: 28px 0 20px; }
    label { display: block; color: #c9d1df; margin: 16px 0 7px; }
    input { width: 100%; height: 46px; padding: 0 12px; background: #111822; border: 1px solid #4a566d; border-radius: 8px; color: inherit; font: inherit; }
    .remember { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; }
    .remember input { width: 18px; height: 18px; padding: 0; margin: 0; accent-color: #e8a8d8; }
    input:focus-visible,button:focus-visible,a:focus-visible { outline: 2px solid #e8a8d8; outline-offset: 3px; }
    button,.enter { display: block; width: 100%; border: 0; border-radius: 8px; padding: 11px; margin-top: 24px; font: inherit; font-weight: 600; color: #19202d; background: linear-gradient(100deg,#a6bcea,#efa6df); cursor: pointer; text-align: center; text-decoration: none; }
    .secondary { border: 1px solid #4a566d; background: transparent; color: #dce1ec; }
    .error { color: #ffb8c2; min-height: 24px; margin: 12px 0 0; }
    footer { color: #aab6cb; font-size: 12px; margin-top: 24px; text-align: center; }
    @media(max-width:480px) { main { padding: 28px 24px; } input { font-size: 16px; } }
  </style>
</head>
<body><main>
  <div class="brand"><span class="mark" aria-hidden="true">✦</span><div><h1>启元</h1><p class="sub">私人远程工作台</p></div></div>
  <!--CONTENT-->
  <footer>加密连接 · 任务在你的 Mac 上执行</footer>
</main></body>
</html>
